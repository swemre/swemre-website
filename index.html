<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SWEMRE</title>
    <meta
      name="description"
      content="SWEMRE: portfolio, articles and projects of Emre, software engineer."
    />
    <!-- Link previews in chats and social networks -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SWEMRE" />
    <meta property="og:title" content="SWEMRE" />
    <meta
      property="og:description"
      content="Portfolio, articles and projects of Emre, software engineer."
    />
    <meta property="og:url" content="http://localhost:5173/" />
    <meta property="og:image" content="http://localhost:5173/images/avatar-384.png" />
    <meta name="twitter:card" content="summary" />
    <link
      rel="alternate"
      type="application/rss+xml"
      title="swemre articles"
      href="/rss.xml"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap"
    />
    <!-- Theme before first paint: dark unless the visitor chose light -->
    <script>
      try {
        var t = localStorage.getItem('swemre:theme')
        if (t !== 'light') t = 'dark'
        document.documentElement.dataset.theme = t
        if (t === 'light') document.documentElement.classList.add('a2-light')
      } catch (e) {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
