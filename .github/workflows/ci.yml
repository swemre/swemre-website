name: CI

# Runs on every push to any branch, so parallel streams find breakage before review.
# The build imports the shared blocks from ../swemre-blocks (vite.config.ts and tsconfig), so
# that repository is checked out next to this one. It is private: BLOCKS_READ_TOKEN is a
# fine-grained token with read access to the contents of swemre/swemre-blocks.
on:
  push:
    branches: ['**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Website checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          path: app

      - uses: actions/checkout@v4
        with:
          repository: swemre/swemre-blocks
          token: ${{ secrets.BLOCKS_READ_TOKEN }}
          path: swemre-blocks

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      - name: Checkstyle
        run: npm run checkstyle

      - name: Build
        run: npm run build
